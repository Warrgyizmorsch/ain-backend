name: Deploy to Live Server

on:
  push:
    branches:
      - deployment
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST || '82.29.191.71' }}
          username: ${{ secrets.SSH_USER || 'u313739815' }}
          password: ${{ secrets.SSH_PASSWORD || 'MPSDnsd@123' }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          script_stop: false
          script: |
            echo "🚀 Starting automated code deployment for branch: ${{ github.ref_name }}..."
            cd /home/u313739815/domains/ain.warrgyizmorsch.com/laravel_app
            
            # Stash any untracked or local changes safely so pull never gets blocked
            git stash --include-untracked || true
            
            # Fetch latest branch from origin
            git fetch origin ${{ github.ref_name }}
            
            # Switch to branch cleanly
            git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}
            
            # Pull latest changes
            git pull origin ${{ github.ref_name }}
            
            # Clear caches safely (NO migrations, NO seeders)
            php artisan optimize:clear
            php artisan view:clear
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            
            # Sync public assets and uploads to public_html
            cp -ru /home/u313739815/domains/ain.warrgyizmorsch.com/laravel_app/public/. /home/u313739815/domains/ain.warrgyizmorsch.com/public_html/ 2>/dev/null || true
            cp -ru /home/u313739815/domains/ain.warrgyizmorsch.com/laravel_app/assets/media/blogthumbnail/. /home/u313739815/domains/ain.warrgyizmorsch.com/public_html/assets/media/blogthumbnail/ 2>/dev/null || true
            cp -ru /home/u313739815/domains/ain.warrgyizmorsch.com/laravel_app/blogs/. /home/u313739815/domains/ain.warrgyizmorsch.com/public_html/blogs/ 2>/dev/null || true
            
            # Touch .htaccess to invalidate opcache
            touch /home/u313739815/domains/ain.warrgyizmorsch.com/public_html/.htaccess 2>/dev/null || true
            
            echo "✅ Deployment completed successfully for ${{ github.ref_name }}!"

